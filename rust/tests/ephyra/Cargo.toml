[package]
name = "ephyra-properties"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Ephyra property tests for connlib's parsers and data structures."

# Standalone on purpose: keeps the property suite and its dependencies out of
# the main workspace and its lockfile.
[workspace]

[dev-dependencies]
deadline-map = { path = "../../libs/connlib/deadline-map" }
dns-over-tcp = { path = "../../libs/connlib/dns-over-tcp" }
l3-tcp = { path = "../../libs/connlib/l3-tcp" }
dns-types = { path = "../../libs/connlib/dns-types" }
http = "1"
domain = "=0.12.3"
anyhow = "1"
base64 = "0.23"
connlib-model = { path = "../../libs/connlib/model" }
flow-log-spool = { path = "../../libs/flow-log-spool" }
flow-log-writer = { path = "../../libs/flow-log-writer" }
flow-tracker = { path = "../../libs/connlib/flow-tracker" }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
incremental-inet-checksum = { path = "../../libs/incremental-inet-checksum" }
ip-packet = { path = "../../libs/connlib/ip-packet" }
ephyra = "0.0.1"

[profile.release]
debug-assertions = true
overflow-checks = true

# Same patches as the main workspace, which path dependencies don't inherit.
[patch.crates-io]
ip_network = { git = "https://github.com/JakubOnderka/ip_network", branch = "master" }
ip_network_table = { git = "https://github.com/edmonds/ip_network_table", branch = "some-useful-traits" }
quinn-udp = { git = "https://github.com/firezone/quinn", version = "0.6.0", branch = "main" }
sanstun = { git = "https://github.com/firezone/sanstun", branch = "main" }
